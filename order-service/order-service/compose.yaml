services:
  mysql:
    image: mysql:8.4
    container_name: order-service-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: order_db
      MYSQL_USER: order_service_user
      MYSQL_PASSWORD: order_service_password
    ports:
      - "3309:3306"
    volumes:
      - order_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "order_service_user", "-porder_service_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-service:
    build:
      context: .
    container_name: order-service-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MENU_SERVICE_URL: http://host.docker.internal:8082
      DB_URL: jdbc:mysql://mysql:3306/order_db
      DB_USERNAME: order_service_user
      DB_PASSWORD: order_service_password
    ports:
      - "8083:8083"

volumes:
  order_mysql_data: