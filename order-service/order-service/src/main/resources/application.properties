spring.application.name=order-service
server.port=8083

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3309/order_db}
spring.datasource.username=${DB_USERNAME:order_service_user}
spring.datasource.password=${DB_PASSWORD:order_service_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:canteen_rabbit_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:canteen_rabbit_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
menu-service.url=${MENU_SERVICE_URL:http://localhost:8082}
user-service.url=http://localhost:8081